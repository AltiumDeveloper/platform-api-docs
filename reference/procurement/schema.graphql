  "An offer selected for this element."
  offer: BomCreateBomOfferReferenceInput
  "A part associated with this element."
  part: BomCreateBomPartReferenceInput!
}

"BOM items are the components of a product."
input BomCreateBomItemInput {
  "A list of designators that specify the placements of the item within the schematic."
  designators: [String!]!
  "All elements that could be used for this item."
  elements: [BomCreateBomItemElementInput!]!
  """
  Extra quantity of the item to order.
  This is added to the product of 'Quantity' and 'BOM Production Quantity' to calculate the 'Total Quantity'.
  """
  extraQuantity: Int
  "The quantity of the item required to produce one unit."
  quantity: Int!
}

"""
Describes an offer selected for an element.
Only a single field must be specified.
"""
input BomCreateBomOfferReferenceInput {
  "A reference to an offer in Octopart."
  octopart: BomOctopartOfferReferenceInput
}

"""
Specifies priorities of different packaging types.
This affects the offer selection in the order list.
"""
input BomCreateBomPackagingPrioritiesSettingsInput {
  "Specifies whether to use packaging type priorities or not."
  enabled: Boolean!
  """
  Specifies the preferred order of packaging types.
  Not specified packaging types will be assigned with the lowest priority.
  """
  order: [BomPackagingType!]!
}

"""
Describes a part associated with an element.
Only a single field must be specified.
"""
input BomCreateBomPartReferenceInput {
  "A reference to a part in Octopart."
  octopart: BomOctopartPartReferenceInput
  "A raw part descriptor (MPN + Manufacturer)."
  raw: BomRawPartReferenceInput
}

"Production-related settings of a BOM (e.g., a 'production quantity' or a 'due date')."
input BomCreateBomProductionSettingsInput {
  "Production due date."
  dueDate: LocalDate
  "Production quantity (i.e., how many units are produced)."
  quantity: Int!
}

"""
Describes a supplier used in a BOM.
Only a single field must be specified.
"""
input BomCreateBomSupplierReferenceInput {
  "A reference to a supplier in Octopart."
  octopart: BomOctopartSupplierReferenceInput
}

input BomExportBomByIdInput {
  "ID of the BOM to export."
  id: ID!
}

input BomExportBomInput {
  "ID of the BOM to export."
  bomId: String!
}

input BomExportBomReleaseInput {
  "ID of the BOM to export."
  bomId: String!
  "ID of the release to export."
  releaseId: String!
}

"A reference to an offer in Octopart."
input BomOctopartOfferReferenceInput {
  "ID of the offer in Octopart."
  offerId: String!
}

"A reference to a part in Octopart."
input BomOctopartPartReferenceInput {
  "ID of the part in Octopart."
  partId: String!
}

"A reference to a supplier in Octopart."
input BomOctopartSupplierReferenceInput {
  "ID of the supplier in Octopart."
  supplierId: String!
}

"A raw part descriptor (MPN + Manufacturer)."
input BomRawPartReferenceInput {
  "Manufacturer name."
  manufacturer: String
  "MPN stands for Manufacturer Part Number. It is a unique identifier issued by manufacturers that identifies individual products."
  mpn: String
}

