  ERROR
  FATAL
  INFORMATION
  SILENT
  WARNING
}

enum BomIssueSeverity {
  ERROR
  FATAL
  INFORMATION
  WARNING
}

enum BomItemElementCustomAttributeType {
  FLOAT
  INTEGER
  MONEY
  PERCENT
  STRING
}

enum BomPackagingType {
  BULK
  CUSTOM_REEL
  CUT_TAPE
  TAPE_AND_BOX
  TAPE_AND_REEL
  TRAY
}
