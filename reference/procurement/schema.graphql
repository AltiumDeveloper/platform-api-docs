  """
  If set to true, the mutation tolerates missing references instead of failing.
  
  Suppliers: Missing ones won’t be added to the BOM.
  Parts: BOM items with a non-existing part reference will remain unmapped.
  Offers: Another available offer will be selected instead.
  """
  tolerateMissingReferences: Boolean! = false
}

"Describes a BOM item element's attribute."
input BomCreateBomItemElementAttributeDeclarationInput {
  """
  A transient identifier that uniquely identifies this attribute within the current mutation call.
  This identifier is used to correlate this attribute with attribute values in BOM item elements.
  """
  attributeId: String!
  "Name of the attribute."
  name: String!
  "Type of the attribute. The actual attribute values may have different types."
  type: BomItemElementCustomAttributeType!
}

"BOM item element attribute."
input BomCreateBomItemElementAttributeInput {
  """
  A transient identifier that uniquely identifies this attribute within the current mutation call.
  This identifier is used to correlate this attribute with the corresponding attribute declaration.
  """
  attributeId: String!
  "Value of the attribute."
  value: BomCreateBomItemElementAttributeValueInput!
}

"BOM item element attribute's value."
input BomCreateBomItemElementAttributeValueInput @oneOf {
  "Floating-point value of a BOM element attribute."
  floatValue: Float
  "Integer value of a BOM element attribute."
  integerValue: Long
  "String value of a BOM element attribute."
  stringValue: String
}

"An element (part) that might be used for a particular BOM item."
input BomCreateBomItemElementInput {
  "Values of custom element attributes."
  attributeValues: [BomCreateBomItemElementAttributeInput!]
  "Description of the element."
  description: String
  "Name of the element."
  name: String
  "An offer selected for this element."
  offer: BomCreateBomOfferReferenceInput
  "A part associated with this element."
  part: BomCreateBomPartReferenceInput!
}

"BOM items are the components of a product."
input BomCreateBomItemInput {
  "A list of designators that specify the placements of the item within the schematic."
  designators: [String!]!
  "All elements that could be used for this item."
  elements: [BomCreateBomItemElementInput!]!
  """
  Extra quantity of the item to order.
  This is added to the product of 'Quantity' and 'BOM Production Quantity' to calculate the 'Total Quantity'.
  """
  extraQuantity: Int
  "The quantity of the item required to produce one unit."
  quantity: Int!
}

"""
Describes an offer selected for an element.
Only a single field must be specified.
"""
input BomCreateBomOfferReferenceInput @oneOf {
  "A reference to an offer in Octopart."
  octopart: BomOctopartOfferReferenceInput
}

"""
Specifies priorities of different packaging types.
This affects the offer selection in the order list.
"""
input BomCreateBomPackagingPrioritiesSettingsInput {
  "Specifies whether to use packaging type priorities or not."
  enabled: Boolean!
  """
  Specifies the preferred order of packaging types.
  Not specified packaging types will be assigned with the lowest priority.
  """
  order: [BomPackagingType!]!
}

"""
Describes a part associated with an element.
Only a single field must be specified.
"""
input BomCreateBomPartReferenceInput @oneOf {
  "A reference to a part in Octopart."
  octopart: BomOctopartPartReferenceInput
  "A raw part descriptor (MPN + Manufacturer)."
  raw: BomRawPartReferenceInput
}

"Production-related settings of a BOM (e.g., a 'production quantity' or a 'due date')."
input BomCreateBomProductionSettingsInput {
  "Production due date."
  dueDate: LocalDate
  "Production quantity (i.e., how many units are produced)."
  quantity: Int!
}

"""
Describes a supplier used in a BOM.
Only a single field must be specified.
"""
input BomCreateBomSupplierReferenceInput @oneOf {
  "A reference to a supplier in Octopart."
  octopart: BomOctopartSupplierReferenceInput
}

"Input for exporting a BOM by its identifier."
input BomExportBomByIdInput {
  "Identifier of the BOM to export."
  id: ID!
}

"Input for exporting a BOM."
input BomExportBomInput {
  "Identifier of the BOM to export."
  bomId: String!
}

"Input for exporting a BOM release."
input BomExportBomReleaseInput {
  "Identifier of the BOM to export."
  bomId: String!
  "Identifier of the release to export."
  releaseId: String!
}

"A reference to an offer in Octopart."
input BomOctopartOfferReferenceInput {
  "Identifier of the offer in Octopart."
  offerId: String!
}

"A reference to a part in Octopart."
input BomOctopartPartReferenceInput {
  "Identifier of the part in Octopart."
  partId: String!
}

"A reference to a supplier in Octopart."
input BomOctopartSupplierReferenceInput {
  "Identifier of the supplier in Octopart."
  supplierId: String!
}

"A raw part descriptor (MPN + Manufacturer)."
input BomRawPartReferenceInput {
  "Manufacturer name."
  manufacturer: String
  "MPN stands for Manufacturer Part Number. It is a unique identifier issued by manufacturers that identifies individual products."
  mpn: String
}

enum BomHealthCheckSeverity {
  ERROR
  FATAL
  INFORMATION
  SILENT
  WARNING
}

enum BomIssueSeverity {
  ERROR
  FATAL
  INFORMATION
  WARNING
}

enum BomItemElementCustomAttributeType {
  FLOAT
  INTEGER
  MONEY
  PERCENT
  STRING
}

enum BomPackagingType {
  BULK
  CUSTOM_REEL
  CUT_TAPE
  TAPE_AND_BOX
  TAPE_AND_REEL
  TRAY
}
