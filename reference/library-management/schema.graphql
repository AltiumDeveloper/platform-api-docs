    "The part to move and the lifecycle state to move it to."
    input: DesPartChangeLifecycleStateInput!
  ): DesPartChangeLifecycleStatePayload!
  "Creates a tag that can be assigned to parts."
  desPartCreateTag(
    "The tag to create."
    input: DesPartCreateTagInput!
  ): DesPartCreateTagPayload!
  "Deletes a part tag. The tag has to be unassigned from every part first."
  desPartDeleteTag(
    "The tag to delete."
    input: DesPartDeleteTagInput!
  ): DesPartDeleteTagPayload!
  "Unassigns a tag from parts. Parts that do not have the tag are not reported as an error."
  desPartDetachTag(
    "The tag to unassign and the parts to unassign it from."
    input: DesPartDetachTagInput!
  ): DesPartDetachTagPayload!
  "Removes custom part by the given identifiers."
  desPartRemoveCustomParts(
    "The custom parts to remove."
    input: DesPartRemoveCustomPartsInput!
  ): DesPartRemoveCustomPartsPayload!
  "Starts a background upload of components with part choices and returns the identifier of the started operation. EXPERIMENTAL: this mutation may change or be removed without notice."
  desPartUploadComponents(
    "The components to upload."
    input: DesPartUploadComponentsInput!
  ): DesPartStartUploadPayload!
  "Uploads a datasheet file for a custom part and returns its public service URL."
  desPartUploadCustomPartDatasheet(
    "The datasheet file to upload."
