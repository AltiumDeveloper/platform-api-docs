type Mutation {
  "Launches a workflow. Workflows allow you to automate design processes, and are created in Altium 365."
  desLaunchWorkflow(input: DesLaunchWorkflowInput!): DesLaunchWorkflowPayload!
  "Terminates a workflow. Workflows allow you to automate design processes, and are created in Altium 365."
  desTerminateWorkflows(input: DesTerminateWorkflowsInput!): DesTerminateWorkflowsPayload!
  "Add new assignment to extension point."
  gloCusAddAssignment(input: GloCusAddAssignmentInput!): GloCusAddAssignmentPayload!
  "Deletes an existing assignment."
  gloCusDeleteAssignment(input: GloCusDeleteAssignmentInput!): GloCusDeleteAssignmentPayload!
  "Executes an existing assignment."
  gloCusExecuteAssignment(input: GloCusExecuteAssignmentInput!): GloCusExecuteAssignmentPayload!
  "Dispatches all active assignments of the given extension point in run-and-forget mode. Returns one entry per assignment; per-assignment failures are surfaced individually and do not abort the others."
  gloCusExecuteExtensionPoint(input: GloCusExecuteExtensionPointInput!): GloCusExecuteExtensionPointPayload!
  "Updates an existing assignment."
  gloCusUpdateAssignment(input: GloCusUpdateAssignmentInput!): GloCusUpdateAssignmentPayload!
  "Updates configuration parameters of an Extension point."
  gloCusUpdateAssignmentConfigurations(input: GloCusUpdateAssignmentConfigurationsInput!): GloCusUpdateAssignmentConfigurationsPayload!
  "Creates a new script."
  gloScrCreateScript(input: GloScrCreateScriptInput!): GloScrCreateScriptPayload!
  "Creates a workspace secret. There is no update: to change a value, delete the secret and add it again."
  gloScrCreateSecret(input: GloScrCreateSecretInput!): GloScrCreateSecretPayload!
  "Deletes a script by its identifier."
  gloScrDeleteScript(input: GloScrDeleteScriptInput!): GloScrDeleteScriptPayload!
  "Deletes a workspace secret by name."
  gloScrDeleteSecret(input: GloScrDeleteSecretInput!): GloScrDeleteSecretPayload!
  "Executes a script asynchronously."
  gloScrExecuteScript(input: GloScrExecuteScriptInput!): GloScrExecuteScriptPayload!
  "Renames an existing script without creating a new version. Optionally, the rename applies only while the script is provisional, meaning it still carries a generated name, and is skipped once the name has been set deliberately. Returns the script's current name either way."
  gloScrRenameScript(input: GloScrRenameScriptInput!): GloScrRenameScriptPayload!
  "Replaces the set of secrets a script revision declares. An empty list removes them all."
  gloScrSetScriptSecrets(input: GloScrSetScriptSecretsInput!): GloScrSetScriptSecretsPayload!
