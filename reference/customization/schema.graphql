  assignmentId: String!
  "Description of the assignment."
  description: String
  "Name of the assignment."
  name: String
  "Workflow Id."
  workflowId: String!
}

input GloScrCreateScriptInput {
  description: String
  name: String!
  package: GloScrScriptPackageInput!
}

input GloScrCreateSecretInput {
  name: String!
  value: String!
}

input GloScrDeleteScriptInput {
  scriptId: String!
}

input GloScrDeleteSecretInput {
  name: String!
}

input GloScrExecuteScriptInput {
  parameters: [GloScrScriptParameterInput!]
  scriptId: String!
  scriptVersionId: String
}

input GloScrRenameScriptInput {
  name: String!
  onlyIfProvisional: Boolean
  scriptId: String!
}

"Represents the result of a script execution."
input GloScrScriptExecutionResultSortInput {
  exitCode: SortEnumType
}

"Represents the execution of a script with status and result information."
input GloScrScriptExecutionSortInput {
  createdAt: SortEnumType
  result: GloScrScriptExecutionResultSortInput
  scriptExecutionId: SortEnumType
  status: SortEnumType
  updatedAt: SortEnumType
}

"Input for defining a script package, including the file token required for retrieval."
input GloScrScriptPackageInput {
  "The token used to access the script package file."
  fileToken: String!
}

"Details of a script package including download information."
input GloScrScriptPackageSortInput {
  fileToken: SortEnumType
}

"Script execution parameter, defining a name-value pair."
input GloScrScriptParameterInput {
  key: String!
  value: String!
}

"Represents a script with details including its versions."
input GloScrScriptSortInput {
  createdAt: SortEnumType
  description: SortEnumType
  name: SortEnumType
  scriptId: SortEnumType
}

"Represents a version of a script."
input GloScrScriptVersionSortInput {
  comment: SortEnumType
  package: GloScrScriptPackageSortInput
  scriptVersionId: SortEnumType
  timestamp: SortEnumType
}

input GloScrSetScriptSecretsInput {
  scriptId: String!
  scriptVersionId: String!
  secretNames: [String!]!
}

input GloScrUpdateScriptInput {
  comment: String
  package: GloScrScriptPackageInput!
  scriptId: String!
}

enum GloCusAssignmentType {
  DEFAULT
  SCRIPT
  WORKFLOW
}

"Represents the types of execution context for extension points."
enum GloCusExecutionContext {
  "Extension points assignments are executed under the system context."
  SYSTEM
  "Extension point assignments are executed under the user context."
  USER
}

enum GloCusScriptExecutionStatus {
  ACTIVATING
  DEACTIVATING
  DEPROVISIONING
  PENDING
  PROVISIONING
  RUNNING
  STOPPED
  STOPPING
  UNKNOWN
}
