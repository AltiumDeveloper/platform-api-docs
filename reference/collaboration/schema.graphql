type Query {
  "Search annotations within a project with results in paged groups."
  desAnnotations(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
    projectId: String!
    where: RequirementFilterInput
  ): DesAnnotationsConnection
  "Search for a specific comment thread associated with a project."
  desCommentThread(
    "The project identifier (`DesProject.id`)."
    projectId: ID!
    "The reference identifier for a comment thread."
    threadId: String!
  ): DesCommentThread
  "Search for comment threads associated with a project."
  desCommentThreads(
    "The project identifier (`DesProject.id`)."
    projectId: ID!
  ): [DesCommentThread!]!
  "The list of project tasks."
  desProjectTasks(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
    "The identifier for a specific project."
    projectId: ID!
  ): DesTaskConnection
  "The list of workspace tasks."
  desWorkspaceTasks(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
    "The URL of the workspace to get tasks from."
    workspaceUrl: String
  ): DesTaskConnection
}

type Mutation {
  "Creates a new comment."
  desCreateComment(input: DesCreateCommentInput!): DesCreateCommentPayload!
  "Creates a new comment thread."
  desCreateCommentThread(input: DesCreateCommentThreadInput!): DesCreateCommentThreadPayload!
  "Creates a project task. A task is a job activity in Altium 365."
  desCreateProjectTask(input: DesCreateProjectTaskInput!): DesCreateTaskPayload!
  "Creates a new comment for the specified task."
  desCreateTaskComment(input: DesCreateTaskCommentInput!): DesCreateTaskCommentPayload!
  "Creates a workspace task. A task is a job activity in Altium 365."
  desCreateWorkspaceTask(input: DesCreateWorkspaceTaskInput!): DesCreateTaskPayload!
  "Permanently deletes the specified comment."
  desDeleteComment(input: DesDeleteCommentInput!): DesDeleteCommentPayload!
  "Permanently deletes a comment thread."
  desDeleteCommentThread(input: DesDeleteCommentThreadInput!): DesDeleteCommentThreadPayload!
  "Deletes the task specified by its node identifier."
  desDeleteTask(input: DesDeleteTaskInput!): DesDeleteTaskPayload!
  "Deletes the specified task comment."
  desDeleteTaskComment(input: DesDeleteTaskCommentInput!): DesDeleteTaskCommentPayload!
  "Updates the specified comment."
  desUpdateComment(input: DesUpdateCommentInput!): DesUpdateCommentPayload!
  "Updates an existing comment thread."
  desUpdateCommentThread(input: DesUpdateCommentThreadInput!): DesUpdateCommentThreadPayload!
  "Updates the specified task."
  desUpdateTask(input: DesUpdateTaskInput!): DesUpdateTaskPayload!
  "Updates the specified task comment."
  desUpdateTaskComment(input: DesUpdateTaskCommentInput!): DesUpdateTaskCommentPayload!
}

type Subscription {
  "Called on subscription events."
  desOnCommentUpdated(input: DesOnCommentUpdatedInput!): DesCommentNotification!
}

"Annotation is like a sticky note you can place in the design, attaching it to design entities (e.g. schematic document, BOM line, design review, etc.). Annotation is a high-level concept that represents different facets of collaboration on the platform - comment threads, tasks to be completed, links or references to other related entities."
type DesAnnotation {
  "Bindings define the 'location' of the annotation, its 'address' in context of the design."
  bindings: [DesAnnotationBinding!]!
  createdAt: DateTime
  createdBy: DesAnnotationUser
  id: String!
  "Requirements, associated with the annotation."
  requirements: DesAnnotationRequirements
  updatedAt: DateTime
  updatedBy: DesAnnotationUser
  "Deep link to the annotation - can be used to navigate to the annotation in the context of its placement."
  url: String
}

type DesAnnotationDesignReviewBinding {
  designReviewId: String!
}

type DesAnnotationDocumentBinding {
  "Name of the document where the annotation is placed."
  documentName: String!
  "Type of the document where the annotation is placed."
  documentType: String!
}

type DesAnnotationManagedBomRowBinding {
  rowId: String!
}

type DesAnnotationReleaseBinding {
  releaseId: String!
}

type DesAnnotationRequirementBinding {
  requirementId: String!
}

type DesAnnotationRequirements {
  id: String!
}

type DesAnnotationRevisionBinding {
  commitHash: String!
}

type DesAnnotationUser {
  displayName: String!
}

"A connection to a list of items."
type DesAnnotationsConnection {
  "A list of edges."
  edges: [DesAnnotationsEdge!]
  "A flattened list of the nodes."
  nodes: [DesAnnotation!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type DesAnnotationsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: DesAnnotation!
}

"A comment is one of remarks associated with a comment thread or task."
