"""
A sorting input type for querying solutions. This class is used to specify sorting criteria when retrieving solutions, allowing clients to sort results by modified date or name in ascending or descending order.
Only one sorting criterion can be applied at a time. If both are provided, the API will prioritize one of them.
"""
input SolSolutionSortInput {
  """
  A filter for sorting by the modified date of the solution.
  The value can be either "Asc" for ascending order or "Desc" for descending order.
  """
  modifiedAt: SortEnumType
  """
  A filter for sorting by the name of the solution.
  The value can be either "Asc" for ascending order or "Desc" for descending order.
